[project]
name = "kalsh"
version = "0.1.0"
description = "Minimal harness for future kalsh work."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0",
    "httpx>=0.28.0",
    "rich>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ty>=0.5.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kalsh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty]
include = ["src/**/*.py", "tests/**/*.py"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

